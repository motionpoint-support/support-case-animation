<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E6EEF8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path></svg>
</button>

<span id="icoMusicOn" style="display: contents;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8FD16F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="17" cy="16" r="3"></circle></svg></span>
<span id="icoMusicOff" style="display: contents;" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A9B8CC" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="17" cy="16" r="3"></circle><path d="M3 3l18 18"></path></svg></span>
<span id="musicLabel">Music on</span>

</button>
<button type="button" class="ctl" id="nextBtn" aria-label="Next scene">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E6EEF8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
</button>
<div style="width: 1px; height: 30px; background: #2A3E5C; margin: 0 4px;"></div>
<div style="display: flex; gap: 6px; flex-grow: 1; overflow: hidden;">
<span id="chapters" style="display: contents;"></span>
</div>
<div style="font-size: 14px; font-weight: 700; color: #A9B8CC; white-space: nowrap; font-variant-numeric: tabular-nums;" id="timeLabel">0:00</div>
</div>
</div>

</div>
</div>
<script>
const STEP_HTML = "<div style=\"height: 52px; padding: 0 18px 0 6px; border-radius: 26px; background: #0B2545; color: #FFFFFF; display: flex; align-items: center; gap: 10px; box-shadow: 0 6px 16px rgba(11,37,69,.22); animation: pop 0.78s ease both;\">\n<span class=\"disp\" style=\"width: 40px; height: 40px; border-radius: 20px; background: #5DB645; color: #0B2545; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700;\">{{st.n}}</span>\n<span style=\"font-size: 15px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase;\">Step {{st.n}} of 8</span>\n</div>";
const SUB_OPEN = "<div style=\"position: absolute; left: 48px; right: 48px; top: 0; height: 70px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 22px; line-height: 1.3; font-weight: 700; color: #F4F7FB; animation: up 0.7s ease both;\">";
function fit(){ const s = Math.min(window.innerWidth / 1280, window.innerHeight / 870); document.getElementById('fit').style.transform = 'scale(' + s + ')'; }
window.addEventListener('resize', fit); fit();
class Player {
  constructor() {
    this.state = { scene: 0, el: 0, playing: false, started: false, ended: false, music: true, subsOn: true };
    this.ctx = null;
  }
  durs() { return [14000, 37500, 21200, 26200, 41400, 39200, 25200, 25200, 28500, 37500]; }
  subLines() {
    return [
      [[0, "Here's how a Support case begins."]],
      [[0, 'A customer spots an issue on their translated site.'], [3749, "Text that isn't translated."], [7264, 'A misaligned layout.'], [13358, 'A broken image or link…'], [19451, "…or a button that won't work."], [25546, 'Or they need help with an offline document translation, SSL Certificate installation, or a CSR generation.'], [32343, 'Either way, they need MotionPoint Support.']],
      [[0, 'They can email Support, or call us.'], [6379, 'But the most common, and most direct way, is to create a case in the portal, MP+.']],
      [[0, 'In the MP+ case portal, they choose Create a Support Case,'], [6526, 'pick Web Localization,'], [10792, 'fill in the form,'], [21587, 'and click Create Case.']],
      [[0, 'The case gets its own number,'], [3975, 'and travels from MP+ into our Support Salesforce case management system.'], [17889, 'The first thing to check for any case: any account warnings.'], [24500, 'Then, look for an orange UAT banner. It means the case may be part of a project\'s UAT phase.'], [30500, 'If you see it, don\'t troubleshoot or bill: complete the milestone, post a customer note, and assign it to the team in the MPD email.']],
      [[0, 'Support reviews the Case Information: the case number, priorities, start and due dates,'], [21200, 'the type, the status, and the language the customer selected.'], [33200, 'The Original Case Owner is usually the SU team member who will work the case.']],
      [[0, 'Customer Information shows who the customer is, which project is involved,'], [10894, 'and what level of service applies — such as Beyond Words 24/7, or Standard.']],
      [[0, 'The Description explains what the customer needs.'], [5827, 'Details, steps to reproduce, URLs, credentials when required, and any other instructions.']],
      [[0, 'Next, navigate to the quick links section above the Case details,'], [8867, 'and click on the Files link.'], [14287, 'Make sure everything mentioned in the Description is actually attached.']],
      [[0, 'Support begins work to determine the next best course of action to take.'], [14061, 'They review, acknowledge, troubleshoot, and thoroughly document the case.'], [22968, 'Then they assign the case to the appropriate team — TAM, PE, QA, or CXM —'], [29530, 'providing the context needed for that team to resolve the case.']]
    ];
  }
  labels() { return ['Intro', 'Issue', 'Contact', 'Portal', 'Case', 'Details', 'Customer', 'Description', 'Files', 'Next step']; }

  /* ---------- original background jazz, synthesized live ---------- */
  bars() {
    // [bass walk (MIDI), chord voicing (MIDI)] — ii-V-I in F with turnarounds, 80 bpm swing
    return [
      [[43, 46, 50, 47], [58, 62, 65, 69]], // Gm9
      [[48, 46, 43, 40], [58, 62, 64, 69]], // C13
      [[41, 45, 48, 49], [57, 60, 64, 67]], // Fmaj9
      [[50, 48, 45, 44], [54, 60, 64, 69]], // D9
      [[43, 46, 50, 47], [58, 62, 65, 69]], // Gm9
      [[48, 46, 43, 40], [58, 62, 64, 69]], // C13
      [[45, 48, 52, 51], [60, 64, 67, 71]], // Am9
      [[50, 48, 45, 44], [54, 60, 64, 69]]  // D9
    ];
  }
  hz(m) { return 440 * Math.pow(2, (m - 69) / 12); }
  initAudio() {
    if (this.ctx) return true;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      const ctx = new AC();
      const master = ctx.createGain();
      master.gain.value = 0;
      const comp = ctx.createDynamicsCompressor();
      master.connect(ctx.destination);
      const len = Math.floor(ctx.sampleRate * 1.0);
      const noise = ctx.createBuffer(1, len, ctx.sampleRate);
      const data = noise.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      this.ctx = ctx; this.master = master; this.noise = noise;
      this.beat = 0; this.nextT = 0;
      return true;
    } catch (e) { return false; }
  }
  melody() {
    // original sax line: [beat position in bar, MIDI note, length in beats]; .5 = swung offbeat
    return [
      [[0, 74, 1.5], [1.5, 77, 0.5], [2, 70, 2]],
      [[0, 69, 1.5], [1.5, 67, 0.5], [2, 76, 2]],
      [[0, 69, 3]],
      [[1, 66, 1], [2, 69, 1], [3, 72, 1]],
      [[0, 70, 1.5], [1.5, 74, 0.5], [2, 77, 2]],
      [[0, 76, 1], [1, 74, 1], [2, 70, 2]],
      [[0, 72, 1.5], [1.5, 71, 0.5], [2, 69, 2]],
      [[0, 66, 2.5]]
    ];
  }
  saxNote(m, t, dur) {
    const c = this.ctx;
    const f0 = this.hz(m);
    const o = c.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(f0 * 0.985, t);
    o.frequency.exponentialRampToValueAtTime(f0, t + 0.07);
    const o2 = c.createOscillator(); o2.type = 'triangle'; o2.frequency.value = f0;
    const lfo = c.createOscillator(); lfo.frequency.value = 5.2;
    const lfoG = c.createGain(); lfoG.gain.setValueAtTime(0, t); lfoG.gain.linearRampToValueAtTime(f0 * 0.006, t + Math.min(0.35, dur * 0.6));
    lfo.connect(lfoG); lfoG.connect(o.frequency); lfoG.connect(o2.frequency);
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 0.8;
    lp.frequency.setValueAtTime(700, t); lp.frequency.linearRampToValueAtTime(1500, t + 0.12); lp.frequency.linearRampToValueAtTime(1100, t + dur);
    const g = c.createGain();
    const end = t + dur;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.075, t + 0.09);
    g.gain.linearRampToValueAtTime(0.06, t + Math.max(0.1, dur - 0.12));
    g.gain.exponentialRampToValueAtTime(0.0001, end + 0.18);
    const g2 = c.createGain(); g2.gain.value = 0.6;
    o.connect(lp); o2.connect(g2); g2.connect(lp); lp.connect(g); g.connect(this.master);
    // breath
    const n = c.createBufferSource(); n.buffer = this.noise;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f0 * 3; bp.Q.value = 2;
    const ng = c.createGain(); ng.gain.setValueAtTime(0.0001, t); ng.gain.linearRampToValueAtTime(0.012, t + 0.05); ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
    n.connect(bp); bp.connect(ng); ng.connect(this.master);
    [o, o2, lfo].forEach((x) => { x.start(t); x.stop(end + 0.25); });
    n.start(t); n.stop(t + 0.4);
  }
  pianoNote(m, t, vel, dur) {
    const c = this.ctx;
    const f = this.hz(m);
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(2600, t); lp.frequency.exponentialRampToValueAtTime(900, t + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vel, t + 0.006);
    g.gain.exponentialRampToValueAtTime(vel * 0.3, t + 0.4);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    lp.connect(g); g.connect(this.master);
    [[1, 1], [2, 0.28], [3, 0.08]].forEach((h) => {
      const o = c.createOscillator(); o.type = 'sine'; o.frequency.value = f * h[0];
      const hg = c.createGain(); hg.gain.value = h[1];
      o.connect(hg); hg.connect(lp);
      o.start(t); o.stop(t + dur + 0.05);
    });
  }
  pianoChord(notes, t, vel, dur) {
    notes.forEach((m, i) => this.pianoNote(m, t + i * 0.018, vel, dur));
  }
  brush(t, vol, dur) {
    const c = this.ctx;
    const s = c.createBufferSource(); s.buffer = this.noise;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 3200; bp.Q.value = 0.7;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + dur * 0.45);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(bp); bp.connect(g); g.connect(this.master);
    s.start(t); s.stop(t + dur + 0.02);
  }
  tap(t, vol, dur, freq) {
    const c = this.ctx;
    const s = c.createBufferSource(); s.buffer = this.noise;
    const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = freq;
    const g = c.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start(t); s.stop(t + dur + 0.02);
  }
  scheduleBeat(i, t) {
    const spb = 60 / 80;
    const sw = spb * 2 / 3;
    const barIx = Math.floor(i / 4) % 8;
    const bar = this.bars()[barIx];
    const b = i % 4;
    // soft drums: brush sweep on every beat, light ride taps, soft hi-hat on 2 and 4
    this.tap(t, 0.014, 0.25, 7500);
    if (b === 1 || b === 3) {
      this.tap(t + sw, 0.01, 0.18, 7500);
      this.tap(t, 0.012, 0.05, 9500);
    }
    // soft piano: low root on beat 1, gentle chord comping
    if (b === 0) {
      this.pianoNote(bar[0][0] + 12, t, 0.05, 2.4);
      this.pianoChord(bar[1], t + 0.03, 0.028, 2.2);
    }
    const v = Math.floor(i / 4) % 2;
    if (b === 2 && v === 0) this.pianoChord(bar[1], t + sw, 0.018, 1.2);
    if (b === 1 && v === 1) this.pianoChord(bar[1], t + sw, 0.018, 1.2);
  }
  schedule() {
    const c = this.ctx;
    if (!c || c.state !== 'running' || !this.musicLive) return;
    if (this.nextT < c.currentTime) this.nextT = c.currentTime + 0.05;
    while (this.nextT < c.currentTime + 0.3) {
      this.scheduleBeat(this.beat, this.nextT);
      this.beat = (this.beat + 1) % 32;
      if (this.beat === 0) this.loop = (this.loop || 0) + 1;
      this.nextT += 60 / 80;
    }
  }
  musicStart() {
    if (!this.state.music || !this.initAudio()) return;
    const c = this.ctx;
    try { c.resume(); } catch (e) {}
    if (!this.musicLive) {
      this.musicLive = true;
      this.beat = 0;
      this.loop = 0;
      this.nextT = c.currentTime + 0.1;
      this.master.gain.cancelScheduledValues(c.currentTime);
      this.master.gain.setValueAtTime(0.0001, c.currentTime);
      this.master.gain.exponentialRampToValueAtTime(0.55, c.currentTime + 1.5);
    }
  }
  musicStop(fade) {
    if (!this.ctx) return;
    const c = this.ctx;
    this.musicLive = false;
    const now = c.currentTime;
    this.master.gain.cancelScheduledValues(now);
    this.master.gain.setValueAtTime(Math.max(this.master.gain.value, 0.0001), now);
    this.master.gain.exponentialRampToValueAtTime(0.0001, now + (fade || 0.3));
  }
  musicPause() { if (this.ctx) { try { this.ctx.suspend(); } catch (e) {} } }
  musicResume() { if (this.ctx && this.state.music) { try { this.ctx.resume(); } catch (e) {} } }

  componentDidMount() {
    this.iv = setInterval(() => this.tick(), 200);
    this.au = setInterval(() => this.schedule(), 60);
  }
  componentWillUnmount() {
    clearInterval(this.iv); clearInterval(this.au); clearTimeout(this.to);
    if (this.ctx) { try { this.ctx.close(); } catch (e) {} }
  }
  tick() {
    const s = this.state;
    if (!s.playing || s.scene < 0) return;
    const d = this.durs();
    const el = s.el + 200;
    if (el >= d[s.scene]) {
      if (s.scene < d.length - 1) this.setState({ scene: s.scene + 1, el: 0 });
      else { this.setState({ el: d[s.scene], playing: false, ended: true }); this.musicStop(3); }
    } else {
      this.setState({ el: el });
    }
  }
  go(i) {
    clearTimeout(this.to);
    this.musicStart();
    this.musicResume();
    this.setState({ scene: -1, el: 0 });
    this.to = setTimeout(() => this.setState({ scene: i, el: 0, started: true, playing: true, ended: false }), 40);
  }
  fmt(ms) {
    const t = Math.floor(ms / 1000);
    const m = Math.floor(t / 60);
    const sec = t % 60;
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }
  renderVals() {
    const s = this.state;
    const d = this.durs();
    const total = d.reduce((a, b) => a + b, 0);
    const cur = s.scene < 0 ? 0 : s.scene;
    let done = 0;
    for (let i = 0; i < cur; i++) done += d[i];
    done += s.scene < 0 ? 0 : s.el;
    const vis = s.started ? s.scene : -2;
    const chapters = this.labels().map((label, i) => ({
      label: label,
      cls: s.started && i === cur ? 'on' : (s.started && i < cur ? 'done' : ''),
      go: () => this.go(i)
    }));
    return {
      s0: vis === 0, s1: vis === 1, s2: vis === 2, s3: vis === 3, s4: vis === 4,
      s5: vis === 5, s6: vis === 6, s7: vis === 7, s8: vis === 8, s9: vis === 9,
      showCover: !s.started,
      showTicket: s.started && s.scene >= 5 && s.scene <= 8,
      pauseCls: s.playing ? '' : 'paused',
      isPlaying: s.playing,
      notPlaying: !s.playing,
      playLabel: s.playing ? 'Pause' : (s.ended ? 'Replay' : 'Play'),
      progressW: (Math.min(1, done / total) * 100).toFixed(2) + '%',
      timeLabel: this.fmt(done) + ' / ' + this.fmt(total),
      chapters: chapters,
      steps: [1, 2, 3, 4, 5, 6, 7, 8].map((n) => ({ n: n, on: s.started && s.scene >= 0 && [0, 1, 2, 2, 3, 4, 5, 6, 7, 8][s.scene] === n })),
      showSubs: s.subsOn && s.started,
      subs: (() => {
        const L = s.scene >= 0 ? this.subLines()[s.scene] : [];
        let act = -1;
        L.forEach((c, i) => { if (s.el >= c[0]) act = i; });
        return L.map((c, i) => ({ text: c[1], on: i === act }));
      })(),
      subsOn: s.subsOn,
      subsLabel: s.subsOn ? 'Hide captions' : 'Show captions',
      subsColor: s.subsOn ? '#8FD16F' : '#A9B8CC',
      toggleSubs: () => this.setState({ subsOn: !this.state.subsOn }),
      musicOn: s.music,
      musicOff: !s.music,
      musicLabel: s.music ? 'Music on' : 'Music off',
      toggleMusic: () => {
        const on = !this.state.music;
        this.setState({ music: on }, () => {
          if (!on) this.musicStop(0.6);
          else if (this.state.playing) this.musicStart();
        });
      },
      togglePlay: () => {
        if (!this.state.started || this.state.ended) this.go(0);
        else {
          const playing = !this.state.playing;
          if (playing) this.musicResume(); else this.musicPause();
          this.setState({ playing: playing });
        }
      },
      replay: () => this.go(0),
      prev: () => this.go(Math.max(0, cur - 1)),
      next: () => this.go(Math.min(d.length - 1, cur + 1))
    };
  }
}


Player.prototype.setState = function (obj, cb) { Object.assign(this.state, obj); this.render(); if (cb) cb(); };
Player.prototype.render = function () {
  const v = this.renderVals();
  const $ = (id) => document.getElementById(id);
  const s = this.state;
  const vis = s.started ? s.scene : -2;
  if (vis !== this._vis) {
    this._vis = vis;
    const tpl = $('scene-' + vis);
    $('sceneHost').innerHTML = tpl ? tpl.innerHTML : '';
  }
  $('stage').classList.toggle('paused', !s.playing);
  $('cover').hidden = !v.showCover;
  $('ticket').hidden = !v.showTicket;
  const st = v.steps.find((x) => x.on);
  const stn = st ? st.n : 0;
  if (stn !== this._step) { this._step = stn; $('steps').innerHTML = stn ? STEP_HTML.split('{{st.n}}').join(String(stn)) : ''; }
  const sb = v.showSubs ? v.subs.find((x) => x.on) : null;
  const key = sb ? s.scene + '|' + sb.text : '';
  if (key !== this._sub) {
    this._sub = key;
    $('subs').innerHTML = '';
    if (sb) { const d = document.createElement('div'); d.innerHTML = SUB_OPEN + '</div>'; d.firstChild.textContent = sb.text; $('subs').appendChild(d.firstChild); }
  }
  $('prog').style.width = v.progressW;
  $('timeLabel').textContent = v.timeLabel;
  $('playLabel').textContent = v.playLabel;
  $('playBtn').setAttribute('aria-label', v.playLabel);
  $('icoPause').hidden = !v.isPlaying; $('icoPlay').hidden = v.isPlaying;
  $('musicLabel').textContent = v.musicLabel; $('musicBtn').setAttribute('aria-label', v.musicLabel); $('musicBtn').setAttribute('aria-pressed', String(v.musicOn));
  $('icoMusicOn').hidden = !v.musicOn; $('icoMusicOff').hidden = v.musicOn;
  $('subsBtn').setAttribute('aria-label', v.subsLabel); $('subsBtn').setAttribute('aria-pressed', String(v.subsOn)); $('subsIcon').setAttribute('stroke', v.subsColor);
  const ck = v.chapters.map((c) => c.cls).join(',');
  if (ck !== this._chips) {
    this._chips = ck;
    const host = $('chapters'); host.innerHTML = '';
    v.chapters.forEach((c, i) => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'chip ' + c.cls; b.textContent = c.label;
      b.addEventListener('click', () => this.go(i)); host.appendChild(b);
    });
  }
};
const P = new Player();
const call = (k) => () => P.renderVals()[k]();
document.getElementById('coverPlay').addEventListener('click', call('togglePlay'));
document.getElementById('playBtn').addEventListener('click', call('togglePlay'));
document.getElementById('replayBtn').addEventListener('click', call('replay'));
document.getElementById('prevBtn').addEventListener('click', call('prev'));
document.getElementById('nextBtn').addEventListener('click', call('next'));
document.getElementById('musicBtn').addEventListener('click', call('toggleMusic'));
document.getElementById('subsBtn').addEventListener('click', call('toggleSubs'));
P.render();
P.componentDidMount();

</script>
</body>
